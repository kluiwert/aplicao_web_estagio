<!DOCTYPE html>
<!--
    ============================================================
    TELA: Login - Reserva FEEC
    ============================================================
    O QUE ESTA TELA ENTREGA VISUALMENTE:
    A porta de entrada do sistema. Um cartão centralizado (estilo
    "Tech" definido em login.css) com o logo da UFAM, o nome do
    Laboratório de Controle e Energia e um formulário simples de
    login com:
      - Matrícula
      - Senha
      - Checkbox "Lembrar-me" e link "Esqueci a senha?"
      - Botão "ENTRAR"
    Abaixo do formulário, um link convida quem ainda não tem conta
    a se cadastrar. No canto superior, um botão fixo "🔒 Acesso
    Restrito" leva ao login exclusivo de administradores. Um botão
    flutuante permite alternar entre tema claro/escuro, com a
    preferência salva no navegador (localStorage).
    ============================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reserva de Equipamentos FEEC</title>

    <!-- Framework de estilos base (grid, botões, inputs prontos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio do projeto: define o cartão "Tech", cores e o tema claro/escuro,
         reaproveitado por todas as outras telas (cadastro, esqueci-senha, admin) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <!-- ============================================================
         Atalho fixo para o login administrativo
         Fica visível em qualquer lugar da tela (posicionamento definido no CSS)
         ============================================================ -->
    <a href="/login-admin" class="btn-admin">
        🔒 Acesso Restrito
    </a>

    <!-- ============================================================
         CARTÃO PRINCIPAL DO FORMULÁRIO
         Centralizado na tela via classe "login-wrapper" (definida no CSS externo)
         ============================================================ -->
    <div class="login-wrapper">
        <div class="card login-card">

            <!-- Cabeçalho: logo + nome do laboratório + subtítulo -->
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo-ufam.png') }}" alt="Logo UFAM" width="95" class="mb-3">
                <h4 class="fw-bold text-dark">Laboratório de Energia e Controle</h4>
                <p class="text-muted mb-0">Sistema de Reservas - FEEC</p>
            </div>

            <!-- Formulário enviado via POST para a rota /login no backend (Flask) -->
            <form action="/login" method="POST">

                <!-- ---------- Matrícula ---------- -->
                <div class="mb-3">
                    <label for="matricula" class="form-label fw-semibold text-secondary">Matrícula</label>
                    <input type="text" class="form-control" id="matricula" name="matricula" placeholder="Ex: 21900000" required autocomplete="username">
                </div>

                <!-- ---------- Senha ---------- -->
                <div class="mb-3">
                    <label for="senha" class="form-label fw-semibold text-secondary">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
                </div>

                <!---- Lembrar-me + Esqueci a senha ----------->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="lembrarMe" name="lembrar_me">
                        <label class="form-check-label small text-muted" for="lembrarMe">
                            Lembrar-me
                        </label>
                    </div>
                    <a href="/esqueci-senha" class="text-decoration-none small fw-semibold link-custom">Esqueci a senha?</a>
                </div>

                <!-- ---------- Botão de envio ---------- -->
                <div class="d-grid gap-2 mt-2">
                    <button type="submit" class="btn btn-primary fw-bold text-uppercase">ENTRAR</button>
                </div>
            </form>

            <!-- Link para quem ainda não tem conta se cadastrar -->
            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Ainda não tem acesso?
                    <a href="/cadastro" class="text-decoration-none fw-bold link-custom">Cadastre-se aqui</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ============================================================
         Botão Flutuante de Tema (claro/escuro)
         ============================================================ -->
    <button class="btn-theme-toggle" id="themeToggle" title="Alternar Tema">
        ☀️
    </button>

    <!-- ============================================================
         Script: persistência do Tema Claro/Escuro
         Guarda a preferência no localStorage do navegador, então ela
         é lembrada mesmo depois de fechar e reabrir a página.
         ============================================================ -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        // Ao carregar a página, verifica se o usuário já escolheu o tema claro antes
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-theme'); // aplica o tema claro
            themeToggleBtn.innerHTML = '🌙';   // ícone de lua = "clique para escurecer"
        }

        // Ao clicar no botão, alterna o tema e salva a nova escolha
        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('light-theme');

            if (body.classList.contains('light-theme')) {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '🌙';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '☀️';
            }
        });
    </script>

</body>
</html>
