<!DOCTYPE html>
<!--
    ============================================================
    TELA: Login - Reserva FEEC
    ============================================================
    O QUE ESTA TELA ENTREGA VISUALMENTE:
    A porta de entrada do sistema. Um cartão centralizado (estilo
    "Tech" definido em login.css) com o logo da UFAM, o nome do
    Laboratório de Controle e Energia e um formulário simples de
    login com:
      - Matrícula
      - Senha
      - Checkbox "Lembrar-me" e link "Esqueci a senha?"
      - Botão "ENTRAR"
    Abaixo do formulário, um link convida quem ainda não tem conta
    a se cadastrar. No canto superior, um botão fixo "🔒 Acesso
    Restrito" leva ao login exclusivo de administradores. Um botão
    flutuante permite alternar entre tema claro/escuro, com a
    preferência salva no navegador (localStorage).
    ============================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reserva de Equipamentos FEEC</title>

    <!-- Framework de estilos base (grid, botões, inputs prontos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio do projeto: define o cartão "Tech", cores e o tema claro/escuro,
         reaproveitado por todas as outras telas (cadastro, esqueci-senha, admin) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <!-- ============================================================
         Atalho fixo para o login administrativo
         Fica visível em qualquer lugar da tela (posicionamento definido no CSS)
         ============================================================ -->
    <a href="/login-admin" class="btn-admin">
        🔒 Acesso Restrito
    </a>

    <!-- ============================================================
         CARTÃO PRINCIPAL DO FORMULÁRIO
         Centralizado na tela via classe "login-wrapper" (definida no CSS externo)
         ============================================================ -->
    <div class="login-wrapper">
        <div class="card login-card">

                       <!-- Cabeçalho institucional: logos organizados em duas linhas -->
            <div class="text-center mb-4">

                <!--
                  LINHA 1: Logos UFAM e FEEC lado a lado.
                  - src: imagem padrão (carregada inicialmente).
                  - data-dark / data-light: versões usadas pelo JS ao alternar o tema.
                  - Os IDs (logoUfam, logoFeec, logoPpgee) são usados pelo script de
                    troca de tema: NÃO renomear sem atualizar o JS.
                -->
                <div class="d-flex justify-content-center align-items-center gap-4 mb-3">
                    <img id="logoUfam"
                        src="{{ url_for('static', filename='logo-ufam.svg') }}"
                        data-dark="{{ url_for('static', filename='logo-ufam.png') }}"
                        data-light="{{ url_for('static', filename='logo-ufam-light.svg') }}"
                        alt="Logo UFAM" width="110">

                    <!-- A logo da FEEC usa o mesmo arquivo nos dois temas -->
                    <img id="logoFeec"
                        src="{{ url_for('static', filename='logo-feec3.png') }}"
                        data-dark="{{ url_for('static', filename='logo-feec3.png') }}"
                        data-light="{{ url_for('static', filename='logo-feec3.png') }}"
                        alt="Logo FEEC" width="90">
                </div>

                <!--
                  LINHA 2: Logo do PPGEE centralizada.
                  Tema escuro: versão branca. Tema claro: versão colorida.
                -->
                <div>
                    <img id="logoPpgee"
                        src="{{ url_for('static', filename='ppgee-branca.png') }}"
                        data-dark="{{ url_for('static', filename='ppgee-branca.png') }}"
                        data-light="{{ url_for('static', filename='ppgee-colorido.png') }}"
                        alt="Logo PPGEE" width="120">
                </div>
            </div>

           
            
            <!-- Formulário enviado via POST para a rota /login no backend (Flask) -->
            <form action="/login" method="POST">

                <!-- ---------- Matrícula ---------- -->
                <div class="mb-3">
                    <label for="matricula" class="form-label fw-semibold text-secondary">Matrícula</label>
                    <input type="text" class="form-control" id="matricula" name="matricula" placeholder="Ex: 21900000" required autocomplete="username">
                </div>

                <!-- ---------- Senha ---------- -->
                <div class="mb-3">
                    <label for="senha" class="form-label fw-semibold text-secondary">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
                </div>

                <!---- Lembrar-me + Esqueci a senha ----------->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="lembrarMe" name="lembrar_me">
                        <label class="form-check-label small text-muted" for="lembrarMe">
                            Lembrar-me
                        </label>
                    </div>
                    <a href="/esqueci-senha" class="text-decoration-none small fw-semibold link-custom">Esqueci a senha?</a>
                </div>

                <!-- ---------- Botão de envio ---------- -->
                <div class="d-grid gap-2 mt-2">
                    <button type="submit" class="btn btn-primary fw-bold text-uppercase">ENTRAR</button>
                </div>
            </form>

            <!-- Link para quem ainda não tem conta se cadastrar -->
            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Ainda não tem acesso?
                    <a href="/cadastro" class="text-decoration-none fw-bold link-custom">Cadastre-se aqui</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ============================================================
         Botão Flutuante de Tema (claro/escuro)
         ============================================================ -->
    <button class="btn-theme-toggle" id="themeToggle" title="Alternar Tema">
        ☀️
    </button>

    <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    const body = document.body;

    // Função que varre os logos e atualiza as imagens conforme o tema ativo
    function atualizarLogos() {
        const isLight = body.classList.contains('light-theme');
        const logos = document.querySelectorAll('#logoUfam, #logoFeec, #logoPpgee');

        logos.forEach(logo => {
            const novaSrc = isLight ? logo.getAttribute('data-light') : logo.getAttribute('data-dark');
            if (novaSrc) {
                logo.src = novaSrc;
            }
        });
    }

    // 1. Ao carregar a página: aplica o tema salvo e atualiza os logos
    if (localStorage.getItem('theme') === 'light') {
        body.classList.add('light-theme');
        themeToggleBtn.innerHTML = '🌙';
    }
    atualizarLogos(); // Atualiza a fonte das imagens ao carregar

    // 2. Ao clicar no botão: alterna o tema, salva a escolha e atualiza os logos
    themeToggleBtn.addEventListener('click', () => {
        body.classList.toggle('light-theme');

        if (body.classList.contains('light-theme')) {
            localStorage.setItem('theme', 'light');
            themeToggleBtn.innerHTML = '🌙';
        } else {
            localStorage.setItem('theme', 'dark');
            themeToggleBtn.innerHTML = '☀️';
        }

        atualizarLogos(); // Troca as imagens dinamicamente no clique
    });
</script>

</body>
</html>
