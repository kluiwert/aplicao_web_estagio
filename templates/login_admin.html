<!DOCTYPE html>
<!--
    ============================================================
    TELA: Login do Administrador - Reserva FEEC
    ============================================================
    O QUE ESTA TELA ENTREGA VISUALMENTE:
    Um cartão centralizado (mesmo estilo "Tech" das demais telas,
    reaproveitando login.css), porém com uma borda vermelha no topo
    e um selo "ÁREA RESTRITA" para deixar claro visualmente que esta
    é a área administrativa, e não o login comum de aluno. Contém:
      - Brasão + nome da UFAM
      - Selo "ÁREA RESTRITA"
      - Título "Painel do Administrador"
      - Formulário com SIAPE/e-mail institucional e senha
      - Botão vermelho "Entrar na Administração" (diferente do azul
        usado no login de aluno, reforçando visualmente o contexto)
      - Link para voltar ao login de alunos
    Também há o botão flutuante de alternância de tema claro/escuro,
    com a preferência salva no localStorage do navegador.
    ============================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reserva FEEC</title>

    <!-- Framework de estilos base (grid, botões, inputs prontos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio do projeto: reutiliza o mesmo arquivo das demais telas
         para manter a identidade visual "Tech" (cores, cartão, tema claro/escuro) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <!-- ============================================================
         CARTÃO PRINCIPAL DO FORMULÁRIO
         Centralizado na tela via classe "login-wrapper" (definida no CSS externo).
         A borda vermelha no topo (border-top) é só um reforço visual
         para diferenciar esta tela do login comum de aluno.
         ============================================================ -->
    <div class="login-wrapper">
        <div class="card login-card" style="border-top: 4px solid #dc3545;">

            <!-- Cabeçalho: brasão + nome da instituição + selo de área restrita + título -->
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo-ufam.png') }}" alt="Brasão UFAM" width="70" class="mb-2">

                
                <!-- Selo vermelho de "Área Restrita" perfeitamente centralizado com mx-auto e d-block -->
                <span class="badge bg-danger mb-2 px-3 py-2 d-block mx-auto text-uppercase" style="letter-spacing: 0.5px; max-width: max-content;">ÁREA RESTRITA</span>

                
                <!-- Trocado 'text-dark' pela variável de título dinâmica -->
                <h5 class="fw-bold mt-2" style="color: var(--texto-titulo) !important;">Painel do Administrador</h5>
                <p class="mb-0 small" style="color: var(--texto-subtitulo) !important;">Gestão de Equipamentos e Reservas</p>
            </div>


            <!-- Formulário enviado via POST para a rota /login-admin no backend (Flask) -->
            <form action="/login-admin" method="POST">

                <!-- ---------- Identificação (SIAPE ou e-mail institucional) ---------- -->
                <div class="mb-3">
                    <label for="siape" class="form-label fw-semibold text-secondary small">SIAPE ou E-mail Institucional</label>
                    <input type="text" class="form-control" id="siape" name="siape" placeholder="Ex: 1234567" required autocomplete="username">
                </div>

                <!-- ---------- Senha de acesso ---------- -->
                <div class="mb-4">
                    <label for="senha" class="form-label fw-semibold text-secondary small">Senha de Acesso</label>
                    <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
                </div>

                <!-- ---------- Botão de envio ----------
                     Usa "btn-danger" (vermelho) em vez do azul padrão do login de
                     aluno, mantendo a mesma identidade visual de "área restrita" -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger fw-bold text-uppercase" style="padding: 12px; font-size: 1.05rem;">
                        Entrar na Administração
                    </button>
                </div>
            </form>

            <!-- Link para voltar ao login comum de alunos -->
            <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(148, 163, 184, 0.2) !important;">
                <a href="/" class="text-decoration-none fw-bold link-custom">← Voltar ao Login de Alunos</a>
            </div>
        </div>
    </div>

    <!-- ============================================================
         Botão Flutuante de Tema (claro/escuro)
         ============================================================ -->
    <button class="btn-theme-toggle" id="themeToggle" title="Alternar Tema">
        ☀️
    </button>

    <!-- ============================================================
         Script: persistência do Tema Claro/Escuro
         Guarda a preferência no localStorage do navegador, então ela
         é lembrada mesmo depois de fechar e reabrir a página.
         ============================================================ -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        // Ao carregar a página, verifica se o usuário já escolheu o tema claro antes
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-theme'); // aplica o tema claro
            themeToggleBtn.innerHTML = '🌙';   // ícone de lua = "clique para escurecer"
        }

        // Ao clicar no botão, alterna o tema e salva a nova escolha
        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('light-theme');

            if (body.classList.contains('light-theme')) {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '🌙';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '☀️';
            }
        });
    </script>
</body>
</html>
