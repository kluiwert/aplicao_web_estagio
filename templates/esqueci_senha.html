<!DOCTYPE html>
<!--
    ============================================================
    TELA: Recuperar Senha - Reserva FEEC
    ============================================================
    O QUE ESTA TELA ENTREGA VISUALMENTE:
    Um cartão centralizado (mesmo estilo "Tech" das telas de Login
    e Cadastro, reaproveitando login.css) com o brasão da UFAM, o
    nome da instituição, um título "Recuperação de Senha" e um
    formulário simples com um único campo (CPF, já com máscara
    automática 000.000.000-00) e um botão "Buscar Conta". Também
    há o botão flutuante de alternância de tema claro/escuro
    (lembrado via localStorage) e um link para voltar ao Login.
    ============================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Reserva FEEC</title>

    <!-- Framework de estilos base (grid, botões, inputs prontos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio do projeto: reutiliza o mesmo arquivo do Login/Cadastro
         para manter a identidade visual "Tech" (cores, cartão, tema claro/escuro) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <!-- ============================================================
         CARTÃO PRINCIPAL DO FORMULÁRIO
         Centralizado na tela via classe "login-wrapper" (definida no CSS externo)
         ============================================================ -->
    <div class="login-wrapper">
        <div class="card login-card">
            <!-- Cabeçalho: brasão + nome da instituição + título + instrução -->
            <div class="text-center mb-4">
                <!--
                  LINHA 1: Logos UFAM e FEEC lado a lado.
                  - src: imagem padrão (carregada inicialmente).
                  - data-dark / data-light: versões usadas pelo JS ao alternar o tema.
                  - Os IDs (logoUfam, logoFeec, logoPpgee) são usados pelo script de
                    troca de tema: NÃO renomear sem atualizar o JS.
                -->
                <div class="d-flex justify-content-center align-items-center gap-4 mb-3">
                    <img id="logoUfam"
                        src="{{ url_for('static', filename='logo-ufam.svg') }}"
                        data-dark="{{ url_for('static', filename='logo-ufam-dark.png') }}"
                        data-light="{{ url_for('static', filename='logo-ufam-light.svg') }}"
                        alt="Logo UFAM" width="110">

                    <!-- A logo da FEEC usa o mesmo arquivo nos dois temas -->
                    <img id="logoFeec"
                        src="{{ url_for('static', filename='logo-feec3.png') }}"
                        data-dark="{{ url_for('static', filename='logo-feec3.png') }}"
                        data-light="{{ url_for('static', filename='logo-feec3.png') }}"
                        alt="Logo FEEC" width="90">
                </div>

                <!--
                  LINHA 2: Logo do PPGEE centralizada.
                  Tema escuro: versão branca. Tema claro: versão colorida.
                -->
                <div>
                    <img id="logoPpgee"
                        src="{{ url_for('static', filename='ppgee-branca.png') }}"
                        data-dark="{{ url_for('static', filename='ppgee-branca.png') }}"
                        data-light="{{ url_for('static', filename='ppgee-colorido.png') }}"
                        alt="Logo PPGEE" width="120">
                </div>
            
            
    
                <h3 class="fw-bold text-white mt-3">Recuperação de Senha</h3>
                <p class="text-muted mb-0 small">Digite seu CPF cadastrado para receber as instruções de recuperação.</p>
            </div>

            <!-- Formulário enviado via POST para a rota /esqueci-senha no backend (Flask) -->
            <form action="/esqueci-senha" method="POST">
                <div class="mb-4">
                    <label for="cpf" class="form-label fw-semibold text-secondary small">CPF</label>
                    <!-- A máscara de digitação (pontos e traço) é aplicada pelo script logo abaixo -->
                    <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary fw-bold text-uppercase">Buscar Conta</button>
                </div>
            </form>

            <!-- Link para voltar à tela de Login -->
            <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(148, 163, 184, 0.2) !important;">
                <a href="/" class="text-decoration-none fw-bold link-custom">← Voltar para o Login</a>
            </div>
        </div>
    </div>

<!-- ============================================================
         Botão Flutuante de Tema (claro/escuro)
         ============================================================ -->
    <button class="btn-theme-toggle" id="themeToggle" title="Alternar Tema">
        ☀️
    </button>

    <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    const body = document.body;

    // Função que varre os logos e atualiza as imagens conforme o tema ativo
    function atualizarLogos() {
        const isLight = body.classList.contains('light-theme');
        const logos = document.querySelectorAll('#logoUfam, #logoFeec, #logoPpgee');

        logos.forEach(logo => {
            const novaSrc = isLight ? logo.getAttribute('data-light') : logo.getAttribute('data-dark');
            if (novaSrc) {
                logo.src = novaSrc;
            }
        });
    }

    // 1. Ao carregar a página: aplica o tema salvo e atualiza os logos
    if (localStorage.getItem('theme') === 'light') {
        body.classList.add('light-theme');
        themeToggleBtn.innerHTML = '🌙';
    }
    atualizarLogos(); // Atualiza a fonte das imagens ao carregar

    // 2. Ao clicar no botão: alterna o tema, salva a escolha e atualiza os logos
    themeToggleBtn.addEventListener('click', () => {
        body.classList.toggle('light-theme');

        if (body.classList.contains('light-theme')) {
            localStorage.setItem('theme', 'light');
            themeToggleBtn.innerHTML = '🌙';
        } else {
            localStorage.setItem('theme', 'dark');
            themeToggleBtn.innerHTML = '☀️';
        }

        atualizarLogos(); // Troca as imagens dinamicamente no clique
    });
</script>
</body>
</html>
