<!DOCTYPE html>
<!--
    ============================================================
    TELA: Recuperar Senha - Reserva FEEC
    ============================================================
    O QUE ESTA TELA ENTREGA VISUALMENTE:
    Um cartão centralizado (mesmo estilo "Tech" das telas de Login
    e Cadastro, reaproveitando login.css) com o brasão da UFAM, o
    nome da instituição, um título "Recuperação de Senha" e um
    formulário simples com um único campo (CPF, já com máscara
    automática 000.000.000-00) e um botão "Buscar Conta". Também
    há o botão flutuante de alternância de tema claro/escuro
    (lembrado via localStorage) e um link para voltar ao Login.
    ============================================================
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Reserva FEEC</title>

    <!-- Framework de estilos base (grid, botões, inputs prontos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio do projeto: reutiliza o mesmo arquivo do Login/Cadastro
         para manter a identidade visual "Tech" (cores, cartão, tema claro/escuro) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <!-- ============================================================
         CARTÃO PRINCIPAL DO FORMULÁRIO
         Centralizado na tela via classe "login-wrapper" (definida no CSS externo)
         ============================================================ -->
    <div class="login-wrapper">
        <div class="card login-card">

            <!-- Cabeçalho: brasão + nome da instituição + título + instrução -->
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo-ufam.png') }}" alt="Brasão UFAM" width="70" class="mb-2">
    
                <h3 class="fw-bold text-white mt-3">Recuperação de Senha</h3>
                <p class="text-muted mb-0 small">Digite seu CPF cadastrado para receber as instruções de recuperação.</p>
            </div>

            <!-- Formulário enviado via POST para a rota /esqueci-senha no backend (Flask) -->
            <form action="/esqueci-senha" method="POST">
                <div class="mb-4">
                    <label for="cpf" class="form-label fw-semibold text-secondary small">CPF</label>
                    <!-- A máscara de digitação (pontos e traço) é aplicada pelo script logo abaixo -->
                    <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" required maxlength="14" inputmode="numeric">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary fw-bold text-uppercase">Buscar Conta</button>
                </div>
            </form>

            <!-- Link para voltar à tela de Login -->
            <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(148, 163, 184, 0.2) !important;">
                <a href="/" class="text-decoration-none fw-bold link-custom">← Voltar para o Login</a>
            </div>
        </div>
    </div>

    <!-- ============================================================
         Botão Flutuante de Tema (claro/escuro)
         ============================================================ -->
    <button class="btn-theme-toggle" id="themeToggle" title="Alternar Tema">
        ☀️
    </button>

    <!-- ============================================================
         Scripts: Máscara de CPF + persistência do Tema Claro/Escuro
         ============================================================ -->
    <script>
        // ==========================================
        // 1. MÁSCARA AUTOMÁTICA DO CPF
        // Formata a digitação em tempo real para 000.000.000-00
        // ==========================================
        const cpfInput = document.getElementById('cpf');

        cpfInput.addEventListener('input', function (e) {
            let valor = e.target.value;

            valor = valor.replace(/\D/g, "");           // remove tudo que não é número
            if (valor.length > 11) valor = valor.slice(0, 11); // limita a 11 dígitos (CPF)

            // Insere os separadores na posição correta
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");       // primeiro ponto
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");       // segundo ponto
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); // traço final

            e.target.value = valor;
        });

        // ==========================================
        // 2. LÓGICA DO MODO CLARO / ESCURO
        // Guarda a preferência no localStorage do navegador,
        // então ela é lembrada mesmo depois de fechar a página.
        // ==========================================
        const themeToggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        // Ao carregar a página, verifica se o usuário já escolheu o tema claro antes
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-theme'); // aplica o tema claro
            themeToggleBtn.innerHTML = '🌙';   // ícone de lua = "clique para escurecer"
        }

        // Ao clicar no botão, alterna o tema e salva a nova escolha
        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('light-theme');

            if (body.classList.contains('light-theme')) {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '🌙';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '☀️';
            }
        });
    </script>
</body>
</html>
